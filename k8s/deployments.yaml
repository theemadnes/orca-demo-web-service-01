apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-heavy-app-default
spec:
  replicas: 9
  selector:
    matchLabels:
      app: cpu-heavy-app
  template:
    metadata:
      labels:
        app: cpu-heavy-app
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: cpu-heavy-app
      nodeSelector:
        cloud.google.com/compute-class: default-compute-class-any
      containers:
      - name: app
        image: us-central1-docker.pkg.dev/cicd-system-demo-01/whereami/orca-demo:04
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
